name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, citation metadata and finite checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: cffconvert --validate
      - run: python tools/run_checks.py

  lean:
    name: Lean build and axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: formalization
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
      - name: Fetch the Mathlib build cache
        working-directory: formalization
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: lake exe cache get
      - name: Build, audit axioms and check paper labels
        working-directory: formalization
        run: python3 verify.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lean-verification
          path: formalization/lean-verification.json
          retention-days: 14

  paper:
    name: Build both PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended fonts-lmodern fonts-dejavu-core
      - run: cd paper && ./build.sh
      - run: python -m pip install PyMuPDF==1.26.6
      - run: python paper/checks/document_structure.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: manuscripts
          path: |
            paper/conference.pdf
            paper/exact_sampling_networks.pdf
            paper/qa/
          retention-days: 14
